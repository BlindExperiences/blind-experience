      steps:[

        {q:'Luxury and comfort, or raw and immersive?',pole:'B',

    expedition:{

        {q:'Luxury that feels earned, or luxury that simply exists?',pole:null,
         a:['photo-1607672390383-aa666b4761ea','Luxury that feels earned','The view you walked to'],

      ],
      closing:{
        A:"You don't travel to rest. You travel to remember what you're capable of. We'll build an expedition that meets you there.",
        B:"The best trips for women aren't about escaping your life. They're about remembering who you are outside of it. We know exactly where to take you.",
        split:"The women who travel best aren't looking for one thing. They want all of it, and so do we. We'll design something that holds the full range of who you are."},
      formLabel:'This is where your Expedition begins.',
      formSub:"Fill in your details. We'll send you our Expedition Questionnaire, and Chiara will reach out personally within 24 hours. From here, we take care of everything.",
      namePh:'Your name',button:'Claim My Spot',confirmImg:'assets/confirm-expedition.jpg'
    }
  };
  var ORDER=['honeymoon','family','legacy','expedition'];
  /* trip keys the backend and Sheet already use ('escape' = family) */
  var KEY={honeymoon:'honeymoon',family:'escape',legacy:'legacy',expedition:'expedition'};
  var RESULT_LABEL={A:'Wild and open',B:'Refined and curated',split:'Both'};

  var $=function(id){return document.getElementById(id)};
  var params=new URLSearchParams(location.search);
  var SRC=(params.get('src')||params.get('utm_source')||'').slice(0,60);
  var product=null, values=[], touched=[], current=0;
  var SITE='https://www.blindexperiences.com';
  var framed=(function(){try{return window.self!==window.top}catch(e){return true}})();
  var small=function(){return window.matchMedia('(max-width:760px)').matches};
  if(!framed)document.getElementById('bej').classList.add('solo');
  /* inside the Wix embed on a phone the frame is taller than the screen,
     so the journey opens on its own, full screen */
  function fullUrl(k){return location.origin+location.pathname+'?product='+k+'&src='+encodeURIComponent(SRC||'website')}
  function breakOut(k){
    var url=fullUrl(k);
    try{window.top.location.href=url;return true}catch(e){}
    var w=null;try{w=window.open(url,'_blank')}catch(e){}
    if(w){$('bej-opened').innerHTML='Your journey has opened full screen in a new tab. <a href="'+url+'" target="_blank" rel="noopener">Open it again</a>';$('bej-opened').classList.add('show');return true}
    return false;
  }
  function leave(){
    if(window.opener){try{window.close()}catch(e){}}
    var r=document.referrer;location.href=(r&&/blindexperiences\.com/.test(r))?r:SITE;
  }

  function track(name,data){try{gtag('event',name,Object.assign({journey:product||'none',source:SRC||'direct'},data||{}))}catch(e){}}
  function show(id){['bej-select','bej-intro','bej-final'].forEach(function(s){$(s).classList.toggle('show',s===id)});
    document.querySelectorAll('#bej .step').forEach(function(s){s.classList.remove('show')});
    $('bej-progress').classList.toggle('on',false);}

  /* selector cards */
  ORDER.forEach(function(k){
    var p=P[k],b=document.createElement('button');b.className='card';b.type='button';
    b.innerHTML='<img src="'+U(p.cardImg,500,660)+'" alt="" loading="lazy"><span class="ct"><span class="cn" style="display:block">'+p.name+'</span><span class="cs">'+p.card+'</span></span>';
    b.addEventListener('click',function(){pick(k)});$('bej-cards').appendChild(b);
  });

  function pick(k,auto){
    if(!auto&&framed&&small()){track('journey_fullscreen',{journey:k});if(breakOut(k))return}
    product=k;var p=P[k];
    $('bej-i-eyebrow').textContent=p.name;$('bej-i-hero').innerHTML=p.hero;
    $('bej-i-sub').textContent=p.sub;$('bej-i-instr').textContent=p.instr;
    build();show('bej-intro');track('journey_select');
  }

  function build(){
    var p=P[product],wrap=$('bej-steps'),prog=$('bej-progress');
    wrap.innerHTML='';prog.innerHTML='';values=p.steps.map(function(){return 50});touched=p.steps.map(function(){return false});
    p.steps.forEach(function(s,i){
      var d=document.createElement('div');d.className='pdot';d.id='pdot-'+i;prog.appendChild(d);
      var el=document.createElement('section');el.className='screen step';el.id='step-'+i;el.setAttribute('aria-label','Choice '+(i+1)+' of '+p.steps.length);
      el.innerHTML=
        '<div class="step-q">'+s.q+'</div>'+
        '<div class="pair">'+
          '<div class="half a" id="ha-'+i+'"><img src="'+U(s.a[0])+'" alt="" '+(i>1?'loading="lazy"':'')+'><div class="half-caption"><div class="half-label">'+s.a[1]+'</div><div class="half-sub">'+s.a[2]+'</div></div></div>'+
          '<div class="divider" id="dv-'+i+'"></div>'+
          '<div class="half b" id="hb-'+i+'"><img src="'+U(s.b[0])+'" alt="" '+(i>1?'loading="lazy"':'')+'><div class="half-caption"><div class="half-label">'+s.b[1]+'</div><div class="half-sub">'+s.b[2]+'</div></div></div>'+
        '</div>'+
        '<div class="controls">'+
          '<div class="readout"><span><span class="arr">&#9650; </span><b id="ra-'+i+'">50</b>%<span class="lbl"> '+s.a[1]+'</span></span><span class="mid" id="rm-'+i+'">Drag to lean</span><span><span class="lbl">'+s.b[1]+' </span><b id="rb-'+i+'">50</b>%<span class="arr"> &#9660;</span></span></div>'+
          '<input type="range" min="0" max="100" step="5" value="50" class="be-range" id="rg-'+i+'" aria-label="'+s.a[1]+' or '+s.b[1]+'" aria-valuetext="50 percent each">'+
          '<div class="nav"><button class="link" type="button" id="bk-'+i+'">'+(i===0?'Back':'Previous')+'</button>'+
          '<button class="btn" type="button" id="nx-'+i+'">'+(i===p.steps.length-1?'See what it says':'Next')+'</button></div>'+
        '</div>';
      wrap.appendChild(el);
      var rg=el.querySelector('#rg-'+i);
      rg.addEventListener('input',function(){touched[i]=true;reflect(i)});
      el.querySelector('#nx-'+i).addEventListener('click',function(){next(i)});
      el.querySelector('#bk-'+i).addEventListener('click',function(){i===0?show('bej-intro'):go(i-1)});
    });
  }

  function reflect(i){
    var v=Number($('rg-'+i).value);values[i]=v;
    var mobile=window.matchMedia('(max-width:600px)').matches;
    $('ha-'+i).style.flexBasis=(100-v)+'%';$('hb-'+i).style.flexBasis=v+'%';
    var dv=$('dv-'+i);if(mobile){dv.style.left='';dv.style.top=(100-v)+'%'}else{dv.style.top='';dv.style.left=(100-v)+'%'}
    $('ha-'+i).classList.toggle('lead',v<45);$('ha-'+i).classList.toggle('fade',v>55);
    $('hb-'+i).classList.toggle('lead',v>55);$('hb-'+i).classList.toggle('fade',v<45);
    $('ra-'+i).textContent=100-v;$('rb-'+i).textContent=v;
    $('rm-'+i).textContent=!touched[i]&&v===50?'Drag to lean':(v===50?'Both, equally':'');
    $('rg-'+i).setAttribute('aria-valuetext',(100-v)+' percent '+P[product].steps[i].a[1]+', '+v+' percent '+P[product].steps[i].b[1]);
  }

  function go(i){
    current=i;show(null);$('bej-progress').classList.add('on');
    $('step-'+i).classList.add('show');
    for(var k=0;k<values.length;k++){$('pdot-'+k).className='pdot'+(k<i?' done':k===i?' current':'')}
    reflect(i);
  }
  function next(i){
    track('journey_step',{step:i+1,lean:values[i],moved:touched[i]});
    if(i<values.length-1){go(i+1)}else{finish()}
  }

  function score(){
    var p=P[product],t=0,n=0;
    p.steps.forEach(function(s,i){if(!s.pole)return;var lean=50-values[i];t+=(s.pole==='A'?lean:-lean);n++});
    var avg=n?t/n:0;return avg>=12?'A':(avg<=-12?'B':'split');
  }
  var result='split';
  function finish(){
    var p=P[product];result=score();
    $('bej-closing').textContent=p.closing[result];
    $('bej-f-label').textContent=p.formLabel;$('bej-f-sub').textContent=p.formSub;
    $('bej-name').placeholder=p.namePh;$('bej-submit').textContent=p.button;
    var ci=$('bej-confirm-img');if(p.confirmImg){ci.src=p.confirmImg;ci.hidden=false}else{ci.hidden=true}
    show('bej-final');track('journey_complete',{result:result});
  }

  $('bej-begin').addEventListener('click',function(){
    if(framed&&small()){track('journey_fullscreen');if(breakOut(product))return}
    try{if(framed)document.getElementById('bej').scrollIntoView({block:'nearest',behavior:'smooth'})}catch(e){}
    go(0);track('journey_start')});
  $('bej-x').addEventListener('click',leave);$('bej-home').addEventListener('click',leave);
  $('bej-change').addEventListener('click',function(){show('bej-select')});
  $('bej-back-final').addEventListener('click',function(){go(values.length-1)});
  window.addEventListener('resize',function(){if(product&&$('step-'+current)&&$('step-'+current).classList.contains('show'))reflect(current)});

  /* form: one POST, honest about failure */
  var form=$('bej-form'),btn=$('bej-submit'),err=$('bej-err'),sent=false;
  function fail(msg){btn.disabled=false;btn.textContent=P[product].button;err.innerHTML=msg;err.classList.add('show')}
  form.addEventListener('submit',function(e){
    e.preventDefault();if(sent)return;err.classList.remove('show');
    var name=form.name.value.trim(),email=form.email.value.trim();
    if(!name){fail('Please add your name.');form.name.focus();return}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){fail('Please check your email address.');form.email.focus();return}
    if(!form.consent.checked){fail('Please tick the box so we can contact you.');return}
    sent=true;btn.disabled=true;btn.textContent='Sending…';
    var p=P[product],now=new Date();
    /* JSON body in the shape the Apps Script backend reads (doPost parses e.postData.contents).
       text/plain keeps it a simple request: no CORS preflight, and the JSON reply is readable. */
    var data={action:'profile',id:'j_'+now.getTime(),timestamp:now.toISOString(),
      tripType:KEY[product],product:p.name,name:name,email:email,phone:form.phone.value.trim(),
      travellers:'',duration:'',experienceType:p.name+': '+RESULT_LABEL[result],
      topTags:[RESULT_LABEL[result]],closing:p.closing[result],
      spectrum:p.steps.map(function(s,i){return {left:s.a[1],right:s.b[1],pct:100-values[i]}}),
      axes:values,source:SRC||'direct',page:document.referrer||location.href,consent:'yes',tool:'visual-journey-v2'};
    /* slow network: say so, but never re-enable the button while the first request is still in flight */
    var timer=setTimeout(function(){err.innerHTML='Still sending. If nothing happens, write to us at <a href="mailto:'+CONTACT+'">'+CONTACT+'</a>.';err.classList.add('show')},15000);
    function ok(){clearTimeout(timer);err.classList.remove('show');$('bej-formwrap').style.display='none';$('bej-confirm').classList.add('show');track('generate_lead',{result:result})}
    function bad(){clearTimeout(timer);sent=false;track('lead_error');fail('We couldn\'t send your details. Please try again, or write to us at <a href="mailto:'+CONTACT+'">'+CONTACT+'</a>.')}
    fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)})
      .then(function(r){return r.json()})
      .then(function(j){j&&j.success?ok():bad()})
      .catch(bad);
  });

  /* deep link: ?product=family skips the selector */
  var pre=(params.get('product')||'').toLowerCase();
  if(P[pre]){pick(pre,true)}
})();
</script>
